services:
  proxy-caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    init: true
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - application
    depends_on:
      web-next:
        condition: service_healthy
      api-hono:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --timeout=2
        - http://127.0.0.1:8080/
      interval: 10s
      timeout: 3s
      retries: 5
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

  web-next:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    expose:
      - "3000"
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api-hono:8787}
    networks:
      - application
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api-hono:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    expose:
      - "8787"
    networks:
      - application
      - database-internal
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jdr_hub_app}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-jdr_hub_dev}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:18080}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID must be set}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET must be set}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-http://localhost:18080/api/auth/discord/callback}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?JWT_SIGNING_SECRET must be set}
      JWT_PREVIOUS_SIGNING_SECRET: ${JWT_PREVIOUS_SIGNING_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jdr_hub_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_USER: ${POSTGRES_USER:-jdr_hub_app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/healthcheck.sh:/usr/local/bin/jdr-healthcheck:ro
    networks:
      - database-internal
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/jdr-healthcheck
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

networks:
  application:
  database-internal:
    internal: true

volumes:
  postgres-data:
