<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>JDR Hub - Création de Partie</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;family=Geist:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#836100",
                        "on-secondary-fixed-variant": "#3a485b",
                        "secondary-fixed": "#d5e3fc",
                        "surface-container-low": "#f2f4f6",
                        "tertiary": "#654a00",
                        "on-primary-fixed-variant": "#5a00c6",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#eff1f3",
                        "primary-fixed": "#eaddff",
                        "secondary-fixed-dim": "#b9c7df",
                        "inverse-surface": "#2d3133",
                        "on-primary-fixed": "#25005a",
                        "background": "#f7f9fb",
                        "surface-dim": "#d8dadc",
                        "error": "#ba1a1a",
                        "surface-bright": "#f7f9fb",
                        "on-tertiary": "#ffffff",
                        "surface": "#f7f9fb",
                        "surface-tint": "#732ee4",
                        "surface-container-high": "#e6e8ea",
                        "on-surface-variant": "#4a4455",
                        "primary": "#630ed4",
                        "primary-container": "#7c3aed",
                        "secondary": "#515f74",
                        "surface-variant": "#e0e3e5",
                        "tertiary-fixed": "#ffdf9f",
                        "secondary-container": "#d5e3fc",
                        "on-tertiary-fixed": "#261a00",
                        "outline-variant": "#ccc3d8",
                        "on-secondary-fixed": "#0d1c2e",
                        "tertiary-fixed-dim": "#f9bd22",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#ede0ff",
                        "surface-container": "#eceef0",
                        "on-background": "#191c1e",
                        "on-error": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e0e3e5",
                        "inverse-primary": "#d2bbff",
                        "on-surface": "#191c1e",
                        "on-tertiary-container": "#ffe2ab",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#d2bbff",
                        "on-tertiary-fixed-variant": "#5c4300",
                        "outline": "#7b7487",
                        "on-secondary-container": "#57657a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "24px",
                        "xl": "40px",
                        "md": "16px",
                        "base": "4px",
                        "xs": "4px",
                        "lg": "24px",
                        "sm": "8px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Hanken Grotesk"],
                        "label-md": ["Geist"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "display-lg": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #f8fafc; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .ambient-shadow {
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.05), 0 8px 10px -6px rgba(124, 58, 237, 0.01);
        }
        .level-1-shadow {
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        }
        .input-ring-focus:focus-within {
            border-color: transparent;
            box-shadow: 0 0 0 2px #7c3aed;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased font-body-md selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col md:flex-row">
<!-- Note: TopAppBar and BottomNavBar are suppressed as this is a linear transactional flow (creation form) -->
<main class="flex-1 w-full max-w-3xl mx-auto px-container-padding py-xl">
<!-- Header -->
<header class="mb-lg text-center md:text-left">
<h1 class="font-headline-lg text-headline-lg text-primary mb-sm">Création de Partie</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Configurez les fondations de votre prochaine aventure épique.</p>
</header>
<!-- Stepper -->
<nav aria-label="Progress" class="mb-xl">
<ol class="flex items-center justify-between" role="list">
<li class="relative pr-8 sm:pr-20">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="h-0.5 w-full bg-primary-container"></div>
</div>
<a class="relative flex h-8 w-8 items-center justify-center rounded-full bg-primary ring-4 ring-surface" href="#">
<span class="material-symbols-outlined text-on-primary text-sm" style="font-variation-settings: 'FILL' 1;">check</span>
<span class="sr-only">Étape 1 complétée</span>
</a>
<span class="absolute -bottom-6 left-1/2 -translate-x-1/2 font-label-md text-label-md text-primary whitespace-nowrap">Bases</span>
</li>
<li class="relative pr-8 sm:pr-20">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="h-0.5 w-full bg-surface-variant"></div>
</div>
<a aria-current="step" class="relative flex h-8 w-8 items-center justify-center rounded-full bg-surface border-2 border-surface-variant ring-4 ring-surface" href="#">
<span class="font-label-md text-label-md text-on-surface-variant">2</span>
<span class="sr-only">Étape 2 en cours</span>
</a>
<span class="absolute -bottom-6 left-1/2 -translate-x-1/2 font-label-md text-label-md text-on-surface-variant whitespace-nowrap">Détails</span>
</li>
<li class="relative">
<a class="relative flex h-8 w-8 items-center justify-center rounded-full bg-surface border-2 border-surface-variant ring-4 ring-surface" href="#">
<span class="font-label-md text-label-md text-on-surface-variant">3</span>
<span class="sr-only">Étape 3 à venir</span>
</a>
<span class="absolute -bottom-6 left-1/2 -translate-x-1/2 font-label-md text-label-md text-on-surface-variant whitespace-nowrap">Joueurs</span>
</li>
</ol>
</nav>
<!-- Form Canvas -->
<div class="bg-surface-container-lowest rounded-xl level-1-shadow p-lg md:p-xl">
<form action="#" class="space-y-lg" method="POST">
<!-- Section Header -->
<div class="border-b border-surface-variant pb-md mb-lg">
<h2 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-primary">book_2</span>
                        Étape 1 : Informations de base
                    </h2>
</div>
<!-- Title Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-sm" for="campaign-title">TITRE DE LA CAMPAGNE</label>
<div class="relative rounded-md input-ring-focus transition-shadow duration-200">
<input class="block w-full rounded-md border-outline-variant bg-surface px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-transparent focus:ring-0" id="campaign-title" name="campaign-title" placeholder="ex: Les Chroniques d'Avalon" type="text" value="Les Chroniques d'Avalon"/>
</div>
</div>
<!-- Bento Grid Layout for Selections -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- System Selection -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface-variant" for="game-system">SYSTÈME DE JEU</label>
<div class="relative input-ring-focus rounded-md transition-shadow duration-200">
<select class="block w-full rounded-md border-outline-variant bg-surface px-4 py-3 font-body-md text-body-md text-on-surface focus:border-transparent focus:ring-0 appearance-none" id="game-system" name="game-system">
<option>Dungeons &amp; Dragons 5E</option>
<option>Call of Cthulhu 7E</option>
<option>Pathfinder 2E</option>
<option>Chroniques Oubliées</option>
<option>Autre / Maison</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Mode Selection -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface-variant" for="play-mode">MODE DE JEU</label>
<div class="relative input-ring-focus rounded-md transition-shadow duration-200">
<select class="block w-full rounded-md border-outline-variant bg-surface px-4 py-3 font-body-md text-body-md text-on-surface focus:border-transparent focus:ring-0 appearance-none" id="play-mode" name="play-mode">
<option>En ligne (VTT)</option>
<option>Présentiel (Autour d'une table)</option>
<option>Hybride</option>
<option>Play-by-Post</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Format Radio Cards -->
<div class="space-y-sm pt-md border-t border-surface-variant">
<label class="block font-label-md text-label-md text-on-surface-variant mb-md">FORMAT DE L'AVENTURE</label>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-md">
<!-- One-shot Card -->
<label class="relative flex cursor-pointer rounded-xl border border-outline-variant bg-surface p-4 focus:outline-none hover:bg-surface-container-low transition-colors group">
<input aria-describedby="format-oneshot-description" aria-labelledby="format-oneshot-label" class="sr-only" name="format" type="radio" value="oneshot"/>
<span class="flex flex-1">
<span class="flex flex-col">
<span class="block font-headline-sm text-headline-sm text-on-surface mb-1 flex items-center gap-2" id="format-oneshot-label">
<span class="material-symbols-outlined text-secondary group-hover:text-primary transition-colors">timer</span>
                                        One-shot
                                    </span>
<span class="mt-1 flex items-center font-body-sm text-body-sm text-on-surface-variant" id="format-oneshot-description">Une session unique. Idéal pour tester un système ou une histoire courte.</span>
</span>
</span>
<span aria-hidden="true" class="pointer-events-none absolute -inset-px rounded-xl border-2 border-transparent peer-checked:border-primary"></span>
</label>
<!-- Campaign Card (Selected) -->
<label class="relative flex cursor-pointer rounded-xl border-2 border-primary bg-primary-container/5 p-4 focus:outline-none hover:bg-primary-container/10 transition-colors">
<input aria-describedby="format-campaign-description" aria-labelledby="format-campaign-label" checked="" class="sr-only" name="format" type="radio" value="campaign"/>
<span class="flex flex-1">
<span class="flex flex-col">
<span class="block font-headline-sm text-headline-sm text-primary mb-1 flex items-center gap-2" id="format-campaign-label">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
                                        Campagne
                                    </span>
<span class="mt-1 flex items-center font-body-sm text-body-sm text-on-surface-variant" id="format-campaign-description">Plusieurs sessions interconnectées formant une épopée continue.</span>
</span>
</span>
<!-- Custom Checkmark for selected state -->
<span class="absolute top-4 right-4 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</span>
</label>
</div>
</div>
<!-- Visual Anchor Image (Decorative) -->
<div class="mt-lg rounded-xl overflow-hidden relative h-32 md:h-48 group">
<div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105" data-alt="A lush, ethereal fantasy landscape at dawn, rendered in a modern digital art style. Soft, high-key lighting illuminates floating crystal formations over a serene lake, reflecting shades of fantasy violet and deep slate blue. The scene is minimal yet magical, evoking a sense of limitless narrative possibility suitable for a premium virtual tabletop interface." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBoy-hgWPFyvsmS-YOUancjxsMvUrx1bbnNd4pPNwx3KlQvD3EweslOP9nQgaKES4Uya8ivvrRIyfyzbR72bFbQ5lVx24HouH5NQDlqZ7uImRMPVkWW3_fFZU2xRzcuBcXu92kMMltkXxy6moUvrhXkjl5-Iwo3V1s9DbFt5NiDF2YrAz2g-Ojw9ZOaLSlAIhuRk7mvAeT6F9smmovREcJMj-R_LjJ_Zf4UjXD-ifV1Xjh6R7eSswww')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-inverse-surface/60 to-transparent"></div>
<div class="absolute bottom-4 left-4 flex items-center gap-2">
<span class="material-symbols-outlined text-on-primary">draw</span>
<span class="font-label-md text-label-md text-on-primary uppercase tracking-wider">Prêt pour l'aventure</span>
</div>
</div>
<!-- Form Actions -->
<div class="pt-lg flex items-center justify-end gap-md border-t border-surface-variant">
<button class="px-6 py-2 font-label-md text-label-md text-secondary border border-outline hover:bg-surface-container-low rounded-full transition-colors" type="button">
                        ANNULER
                    </button>
<button class="px-6 py-2 bg-primary text-on-primary font-label-md text-label-md rounded-full shadow-sm hover:bg-primary-container hover:text-on-primary-container transition-all flex items-center gap-2 ambient-shadow" type="submit">
                        CONTINUER
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
</body></html>
